<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started - Estudyante Balanse</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800&family=Baloo+2:wght@400;600;700;800&family=Jua&display=swap" rel="stylesheet">
</head>
<body>
    <div class="min-h-screen bg-cover bg-center bg-no-repeat" style="background-image: url('images/eb_start_bg.jpeg')">
        <div class="p-10 pt-5">
            <img src="images/eb_login_logo.png" alt="logo" class="h-25 w-auto">
        </div>

        <div class="flex flex-col md:flex-row items-start justify-start gap-10 pl-20 pr-6 pb-10">
            <div class="flex-none w-fit">
                <img src="images/eb_comic_start.png" alt="comic" class="w-full max-w-xl rounded-3xl">
            </div>

            <div class="flex-1 flex justify-start mb-2 -mt-10">
                <div class="w-full max-w-lg p-5 flex flex-col items-start">
                    <img src="images/eb_start_header.jpeg" alt="let's get started" class="w-full h-42 object-contain mb-2">
                    <div class="ml-10 w-full mt-10">
                        <h2 class="text-3xl text-left font-black font-['Nunito'] text-[#002C77]">What should we call you?</h2>

                        <div class="w-full h-13.75 flex items-center bg-[#FEFEFE] border-2 border-[#D4DFEC] rounded-[18px] box-border transition-all focus-within:border-[#FDD050] focus-within:shadow-[0_0_0_4px_rgba(253,208,80,0.12)] mt-5 mb-4">
                            <span class="ml-6.25 mr-3.75 text-[25px] text-[#6E819D]"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg></span>
                            <input type="text" id="nameInput" placeholder="Enter your name" style="font-family: 'Nunito Sans', 'Nunito', sans-serif" class="flex-1 h-full pr-6.25 border-none outline-none bg-transparent text-[20px] font-semibold text-[#193257] placeholder:text-[#71819A]">
                        </div>
                        <a href="create-account.html" onclick="saveName(event)" style="font-family: 'Nunito Sans', 'Nunito', sans-serif" class="w-full h-12.5 bg-[#FFD75A] text-[#17243a] font-extrabold text-[18px] rounded-[18px] flex items-center justify-center gap-2 hover:bg-[#FFCA3A] cursor-pointer">
                            Continue
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="M13 6l6 6-6 6" /></svg>
                        </a>

                        <div style="font-family: 'Nunito Sans', 'Nunito', sans-serif" class="w-full flex justify-center items-center gap-2 mt-2.5 text-[18px] font-medium text-[#71819A]">
                            <span>Already have an account?</span>
                            <a href="login.html" class="text-[#3186D8] font-semibold underline decoration-[#3186D8] underline-offset-[3px] cursor-pointer transition-all hover:text-[#193257] hover:decoration-[#193257]">Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
