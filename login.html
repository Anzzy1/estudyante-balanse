<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Estudyante Balanse</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka:wght@400;500;600;700&family=Chewy&family=Jua&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <nav>
        <a href="index.html"><img src="images/eb_login_logo.png" alt="Estudyante Balanse" class="logo logo-login"></a>
        <a href="index.html" class="btn-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          Back to Home
        </a>
    </nav>

    <main class="login-wrap">
      <section class="login-intro">
        <h1>Welcome<br><span>back!</span></h1>
        <p>Small steps, big dreams.<br>Sign in and keep your student life on track.</p>
        <img src="images/eb_login_comic.png" alt="Student ready to balance school life" class="login-comic">
      </section>

      <section class="login-card">
        <h2>Log In</h2>
        <p class="login-sub">Enter your details to continue.</p>

        <form class="login-form" id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input type="email" id="email" name="email" placeholder="you@school.edu" autocomplete="email">
            </div>
            <small class="error" id="emailError"></small>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
              </button>
            </div>
            <small class="error" id="passError"></small>
          </div>

          <div class="form-row">
            <label class="remember">
              <input type="checkbox" id="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmit">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-text">Sign In</span>
          </button>

          <p class="msg" id="msg" role="status" aria-live="polite"></p>
        </form>

        <p class="signup-line">Don't have an account? <a href="#">Sign Up</a></p>
      </section>
    </main>

    <script>
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');
      const togglePass = document.getElementById('togglePass');
      const btnSubmit = document.getElementById('btnSubmit');
      const msg = document.getElementById('msg');

      // Show / hide password
      togglePass.addEventListener('click', () => {
        const showing = passInput.type === 'text';
        passInput.type = showing ? 'password' : 'text';
        togglePass.classList.toggle('is-on', !showing);
        togglePass.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });

      function setError(input, el, text) {
        el.textContent = text;
        input.closest('.field').classList.toggle('has-error', Boolean(text));
      }

    </script>
</body>
</html>
