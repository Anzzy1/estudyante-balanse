<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Estudyante Balanse</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="login-page">
        <!-- LEFT SIDE -->
        <section class="login-left">
            <div class="brand">
                <img src="images/eb_login_logo.png" alt="Estudyante Balanse Logo" class="brand-logo">
            </div>
            <div class="intro-content">
                <h2>Better Schedule. Brighter Future.</h2>
                <p>Plan your studies, manage your time,<br>and achieve your goals — all in one place.</p>
            </div>
            <div class="paper-plane"><span>➤</span></div>
            <div class="character-area">
                <img src="images/eb_login_comic.png?v=2" alt="Estudyante Balanse Student" class="login-character">
            </div>
            <span class="star star-one">✦</span>
            <span class="star star-two">✦</span>
            <span class="star star-three">✦</span>
        </section>

        <!-- RIGHT SIDE -->
        <section class="login-right">
            <div class="login-card">
                <div class="login-heading">
                    <h2>Welcome Back!</h2>
                    <p>Log in to your Estudyante Balanse account</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
                            </span>
                            <input type="email" id="loginEmail" name="email" placeholder="Enter your email address" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 018 0v3"></path></svg>
                            </span>
                            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                                <svg id="eyeOpen" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                                <svg id="eyeClosed" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18"></path><path d="M10.5 6.2A10.7 10.7 0 0112 6c6.5 0 10 6 10 6a17.5 17.5 0 01-4.1 4.4"></path><path d="M6.2 6.2C3.4 8 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"></path></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="login-button"><span>Log In</span><span class="button-arrow">→</span></button>
                </form>

                <div class="login-message">
                    <span class="message-star">✦</span>
                    <p>Small steps today,<br>big dreams tomorrow.</p>
                    <span class="message-star">✦</span>
                </div>

                <div class="login-footer">
                    Don't have an account? <a href="get-started.html">Sign up</a>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js?v=4"></script>
    <script>
        // Password toggle
        (function() {
            const passwordInput = document.getElementById('loginPassword');
            const toggle = document.getElementById('passwordToggle');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');
            toggle.addEventListener('click', function() {
                const show = passwordInput.type === 'password';
                passwordInput.type = show ? 'text' : 'password';
                eyeOpen.classList.toggle('hidden', show);
                eyeClosed.classList.toggle('hidden', !show);
                toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });
        })();
        // Login submit → app.js doLogin
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            doLogin();
        });
    </script>
</body>
</html>
