<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estudyante Balanse</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&family=Jua&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container" style="background-image: url('images/eb_start_bg.jpeg')">
        <div class="page-logo">
            <img src="images/eb_login_logo.png" alt="logo">
        </div>

        <div class="page-content-row" style="padding-left: 24px;">
            <div class="comic-image">
                <img src="images/eb_login_comic.png" alt="comic">
            </div>

            <div class="form-section" style="margin-top: -80px;">
                <div class="form-container" style="margin-left: -120px;">
                    <img src="images/eb_login_logo.png" alt="Login" class="form-header" style="margin-left: -40px;">
                    <h2 class="form-title">Welcome back!</h2>
                    <p class="form-subtitle">Login to your account to continue</p>

                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3" /><path d="m2 7 10 6L22 7" /></svg>
                        </span>
                        <input type="email" id="loginEmail" placeholder="Email address" class="input-field">
                    </div>

                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="3" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
                        </span>
                        <input type="password" id="loginPassword" placeholder="Password" class="input-field">
                        <button type="button" onclick="toggleLoginPassword()" class="ml-2" style="color: #7d99be; cursor: pointer; background: none; border: none;">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
                        </button>
                    </div>

                    <button onclick="doLogin()" class="btn-primary">
                        Login
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="M13 6l6 6-6 6" /></svg>
                    </button>

                    <div class="divider-text">
                        <span>Don't have an account? </span>
                        <a href="get-started.html" class="text-link">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
