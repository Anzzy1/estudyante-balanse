<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Estudyante Balanse</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&family=Jua&display=swap" rel="stylesheet">
</head>
<body>
    <div class="min-h-screen bg-cover bg-center bg-no-repeat" style="background-image: url('images/eb_start_bg.jpeg')">
        <div class="p-10 pt-5">
            <img src="images/eb_login_logo.png" alt="logo" class="h-25 w-auto">
        </div>

        <div class="flex flex-col md:flex-row items-start justify-start gap-2 pl-17 pr-6 pb-10">
            <div class="flex-none w-fit">
                <img src="images/eb_welcome_comic.png" alt="comic" class="w-full max-w-xl anim-fade-up">
            </div>

            <div class="flex-1 flex justify-center">
                <div class="w-full max-w-2xl p-5 flex flex-col items-start anim-fade-up-1">
                    <h1 style="font-family: 'Baloo 2', sans-serif" class="font-black text-[#002C77] flex items-center -ml-8 gap-2 -rotate-2">
                        <span class="text-7xl font-black" id="welcomeName">Welcome, Anzar!</span>
                        <span class="w-[50px] h-[50px] flex items-center justify-center bg-[#FFC83D] rounded-full flex-none">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M20 6 9 17l-5-5" /></svg>
                        </span>
                    </h1>
                    <h2 class="text-4xl font-bold mt-6 text-[#002C77]" style="font-family: 'Nunito', sans-serif">Your account is ready.</h2>
                    <p class="text-[#6682AD] text-xl mt-4 mb-8">You're all set! Estudyante Balance includes both <br> allowance tracking and time management to help <br> you manage your student life.</p>

                    <a href="setup.html" class="w-full max-w-md h-[60px] bg-[#FFD75A] text-[#17243a] font-extrabold text-[18px] rounded-full flex items-center justify-center gap-2 hover:bg-[#FFCA3A] cursor-pointer" style="font-family: 'Nunito', sans-serif">Set Up My Account
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="M13 6l6 6-6 6" /></svg>
                    </a>

                    <p class="text-[#6682AD] text-lg mt-5 mb-6">Let's personalize your dashboard next.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js?v=3"></script>
</body>
</html>
