<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Estudyante Balanse</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800&family=Baloo+2:wght@400;600;700;800&family=Jua&display=swap" rel="stylesheet">
</head>
<body>
    <div class="min-h-screen bg-cover bg-center bg-no-repeat" style="background-image: url('images/eb_start_bg.jpeg')">
        <div class="p-10 pt-5">
            <img src="images/eb_login_logo.png" alt="logo" class="h-25 w-auto">
        </div>

        <div class="flex flex-col md:flex-row items-start justify-start gap-4 pl-6 pr-6 pb-10">
            <div class="flex-none w-fit">
                <img src="images/eb_comic_otp.png" alt="comic" class="w-full max-w-2xl">
            </div>

            <div class="flex-1 flex justify-center md:-mt-20">
                <div class="w-full max-w-lg p-5 flex flex-col items-start -ml-30">
                    <img src="images/eb_otp_header.png" alt="Verify Email" class="w-full max-w-md -ml-10">
                    <p class="text-xl font-semibold text-[#71819A] mt-5" style="font-family: 'Nunito', sans-serif">We sent a 6-digit verification code <br> to your email address.</p>

                    <div class="flex gap-2 mb-1 px-10 py-10">
                        <input id="otp-0" maxlength="1" class="w-[52px] h-[68px] text-center text-2xl text-[#17243a] font-black border-[3px] border-[#c4ddf8] rounded-2xl outline-none focus:border-[#ffbf27]">
                        <input id="otp-1" maxlength="1" class="w-[52px] h-[68px] text-center text-2xl text-[#17243a] font-black border-[3px] border-[#c4ddf8] rounded-2xl outline-none focus:border-[#ffbf27]">
                        <input id="otp-2" maxlength="1" class="w-[52px] h-[68px] text-center text-2xl text-[#17243a] font-black border-[3px] border-[#c4ddf8] rounded-2xl outline-none focus:border-[#ffbf27]">
                        <input id="otp-3" maxlength="1" class="w-[52px] h-[68px] text-center text-2xl text-[#17243a] font-black border-[3px] border-[#c4ddf8] rounded-2xl outline-none focus:border-[#ffbf27]">
                        <input id="otp-4" maxlength="1" class="w-[52px] h-[68px] text-center text-2xl text-[#17243a] font-black border-[3px] border-[#c4ddf8] rounded-2xl outline-none focus:border-[#ffbf27]">
                        <input id="otp-5" maxlength="1" class="w-[52px] h-[68px] text-center text-2xl text-[#17243a] font-black border-[3px] border-[#c4ddf8] rounded-2xl outline-none focus:border-[#ffbf27]">
                    </div>

                    <a href="welcome.html" class="w-full h-[50px] bg-[#FFD75A] text-[#17243a] font-extrabold text-[18px] rounded-[18px] flex items-center justify-center gap-2 hover:bg-[#FFCA3A] cursor-pointer" style="font-family: 'Nunito', sans-serif">Verify Email
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14" /><path d="M13 6l6 6-6 6" /></svg>
                    </a>
                    <div style="font-family: 'Nunito Sans', 'Nunito', sans-serif" class="w-full flex justify-center items-center gap-2 mt-[10px] text-[18px] font-medium text-[#71819A]">
                        <span>Didn't receive code? </span>
                        <a href="#" class="text-[#3186D8] font-semibold underline decoration-[#3186D8] underline-offset-[2px] cursor-pointer transition-all hover:text-[#193257] hover:decoration-[#193257]">Resend code</a>
                    </div>

                    <a href="create-account.html" class="w-full flex items-center justify-center gap-2 text-center mt-8 text-[#3186D8] font-semibold underline decoration-[#3186D8] underline-offset-[2px] cursor-pointer transition-all hover:text-[#193257] hover:decoration-[#193257]">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5" /><path d="M11 18l-6-6 6-6" /></svg>
                        Change Email</a>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
